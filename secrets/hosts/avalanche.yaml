# Plaintext template. Run `make secret-host HOST=avalanche` to encrypt with sops.
# Add host-specific secrets as YAML keys. Example structure:

wifi_psk: |
  # Replace with the real network credentials
  SSID=example-network
  PSK=example-password

api_tokens:
  grafana: "gf_api_token_goes_here"
  uptime-kuma: "uk_api_token_goes_here"

docker_config: |
  {
    "auths": {
      "registry.example.com": {
        "auth": "BASE64_ENCODED_CREDS"
      }
    }
  }
